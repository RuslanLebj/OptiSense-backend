services:

  nginx:
    image: nginx:alpine
    container_name: optisense-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf  # Конфигурация Nginx
      - ../src/optisense/static:/opt/app/src/optisense/static  # Путь к статическим файлам
    depends_on:
      - optisense
    networks:
      - optinet

  optisense:
    container_name: optisense-app
    ports:
      - "8000:8000"
    build:
      dockerfile: ./docker/app/Dockerfile
      context: ../
    command: >
      bash -c "cd src/optisense
      && python manage.py migrate
      && python manage.py collectstatic --noinput
      && python manage.py createsuperuser --no-input || true
      && python -m gunicorn optisense.asgi:application -k uvicorn_worker.UvicornWorker --bind 0.0.0.0:8000 --reload"
    volumes:
      - ../:/opt/app
    restart: on-failure
    depends_on:
      optisense-db:
        condition: service_healthy
    env_file:
      - app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    networks:
      - optinet

  optisense-db:
    container_name: optisense-db
    image: postgres:15.5-alpine
    ports:
      - "54320:5432"
    healthcheck:
      test: [ "CMD", "psql" ,"-U", "postgres", "-w", "-c", "SELECT 1;" ]
      timeout: 0.5s
      interval: 0.5s
      retries: 100
    env_file:
      - postgres/local.env
    networks:
      - optinet


networks:
  optinet:
    name: "optinet-network"
    driver: bridge